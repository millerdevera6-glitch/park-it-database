<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Park-It Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .form-group { margin-bottom: 10px; }
        button { padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Park-It System</h1>

    <!-- CREATE: Form to add a new zone -->
    <h2>Add New Parking Zone</h2>
    <form id="add-zone-form">
        <div class="form-group">
            <input type="text" id="zoneName" placeholder="Zone Name (e.g., North Lot)" required>
            <input type="number" id="maxCapacity" placeholder="Max Capacity" required>
            <button type="submit">Create Zone</button>
        </div>
    </form>

    <!-- RETRIEVE: Table to show database records -->
    <h2>Current Zones</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Zone Name</th>
                <th>Capacity</th>
                <th>Occupied</th>
                <th>Actions (Update / Delete)</th>
            </tr>
        </thead>
        <tbody id="zones-table-body">
            <!-- Data will be injected here by app.js -->
        </tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>
