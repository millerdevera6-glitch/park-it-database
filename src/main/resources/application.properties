spring.application.name=brewpos
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}

# --- PostgreSQL (credentials come from environment variables; never commit secrets) ---
# Recommended account: set DB_USERNAME=brewpos_app after running database/05_create_app_role.sql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/grp_brewposdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate: validate the existing schema, never create/alter/drop it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Do not leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
